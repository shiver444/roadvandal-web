import sys
import asyncio
import platform
import json
from pathlib import Path

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#0b0813"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "racing"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/racing
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("racing.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("racing.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # now make a prompt
        msg  = "TAP TO PLAY"
        platform.window.infobox.innerText = msg
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    try:
        platform.window.rvhide()
    except Exception:
        pass

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

        #rvtitle { font-family: RVDirt, Impact, sans-serif; font-size: 11vmin; letter-spacing: 0.04em; color: #e6be32; text-shadow: 0 0.06em 0 #000; }
        #rvbar { width: 46vmin; height: 1.5vmin; margin-top: 5vh; background: #1c1426; border: 1px solid #5a3a14; border-radius: 1vmin; overflow: hidden; }
        #rvbar i { display: block; height: 100%; width: 35%; background: linear-gradient(90deg, #ff8214, #e6be32); animation: rvslide 1.2s ease-in-out infinite alternate; }
        #rvbar.done i { width: 100%; animation: none; margin-left: 0; }
        @keyframes rvslide { from { margin-left: 0; } to { margin-left: 65%; } }
        #rvsub { font-family: RVWet, Impact, sans-serif; font-size: 6vmin; color: #ff8214; margin-top: 1vmin; text-shadow: 0 0 0.4em #5a1e8c, 0 0.06em 0 #5a1e8c; }
        #status {
            display: inline-block;
            vertical-align: top;
            margin-top: 20px;
            margin-left: 30px;
            font-weight: bold;
            color: rgb(120, 120, 120);
        }

        #progress {
            height: 20px;
            width: 300px;
        }

        #infobox {
            position: fixed !important; /* always dead centre, whatever the screen shape or rotation */
            left: 50% !important; top: 58% !important; right: auto !important; bottom: auto !important;
            transform: translate(-50%, -50%) !important;
            white-space: nowrap; max-width: 90vw;
            background: #ff8214;
            color: #1a0e04;
            font-family: Arial, sans-serif;
            font-weight: bold;
            letter-spacing: 0.12em;
            font-size: 22px;
            border-radius: 6px;
            padding: 16px 36px;
 /*           display: none; */
            z-index: 999999;
        }
        div.emscripten { text-align: center; }
        div.emscripten_border { border: 1px solid black; }
        div.thick_border { border: 4px solid black; }

        /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
        /* average size of droid screen 470dp x 320dp  */
        canvas.emscripten {
            border: 0px none;
            background-color: transparent;
            width: 100%;
            height: 100%;
            z-index: 5;

            padding: 0;
            margin: 0 auto;

            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;

    <script type="application/javascript">

    globalThis.__canvas_resized = (self, ecw, ech) => {
        console.warn("TODO: panda3d canvas monitor", self, ecw, ech)
    }

    async function custom_onload(debug_hidden) {
        // this is called before anything python is loaded
        // make your js customization here
        console.log(__FILE__, "custom_onload")

        pyconsole.hidden = debug_hidden
        system.hidden = debug_hidden
        transfer.hidden = debug_hidden
        info.hidden = debug_hidden
        box.hidden =  debug_hidden

        show_infobox()
    }

    function rvhide() { document.getElementById("rvsplash").style.display = "none"; }

    // the moving bar turns solid when the game says it is ready
    setInterval(function () {
        var b = document.getElementById("rvbar"), m = document.getElementById("infobox");
        if (b && m && (m.innerText || "").indexOf("TAP") >= 0) b.className = "done";
    }, 300);

    // Safari: no pinch / double-tap zoom while playing
    ["gesturestart", "gesturechange", "gestureend", "dblclick"].forEach(function (n) {
        document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false });
    });
    document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

    // go fullscreen / sideways on the very first tap (TAP TO PLAY), so Chrome's "full screen" notice is over by the time the menu shows
    (function () {
        var tries = 0;
        function fs() {
            if (window.__rvfs || tries++ > 2) return;
            try {
                var e = document.documentElement, f = e.requestFullscreen || e.webkitRequestFullscreen;
                if (f && !document.fullscreenElement && !document.webkitFullscreenElement) {
                    var p = f.call(e);
                    window.__rvfs = true;
                    var lock = function () {
                        try { screen.orientation.lock("landscape").catch(function () {}); } catch (x) {}
                    };
                    if (p && p.then) p.then(lock).catch(function () { window.__rvfs = false; }); else lock();
                }
            } catch (x) {}
        }
        document.addEventListener("click", fs, true);
        document.addEventListener("touchend", fs, true);
        // TAP TO PLAY can also be answered with Enter or Space
        document.addEventListener("keydown", function (ev) {
            if (ev.code !== "Enter" && ev.code !== "Space" && ev.code !== "NumpadEnter") return;
            var m = document.getElementById("infobox");
            if (!m || m.style.display === "none" || (m.innerText || "").indexOf("TAP") < 0) return;
            fs();
            try { document.body.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window })); } catch (x) {}
        }, true);
    })();

    function custom_prerun(){
        // no python main and no (MEMFS + VFS) yet.
        console.log(__FILE__, "custom_prerun")

    }

    function custom_postrun(){

    function debug() {

        python.config.debug = true
        custom_onload(false)
        Module.PyRun_SimpleString("shell.uptime()")

    function info_inline(data){
        document.getElementById("info").innerHTML = data
    }

    function info_online(url) {
        // display info about current APK
        fetch( url /*, options */)
            .then((response) => response.text())
            .then((html) => {
                info_inline(html);
        })
        .catch((error) => {
            console.warn(error);
        });
    }

    function frame_online(url) {
        window.frames["iframe"].location = url;
    }
